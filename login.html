<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to the company operations dashboard.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#060b14" media="(prefers-color-scheme: dark)">
  <title>Sign in — UniCRM</title>
  <script>
    // Resolve the theme before first paint so there is no flash.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (error) { /* storage blocked */ }
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : (dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
  <script src="config.js"></script>
</head>
<body class="login">
  <main class="login-wrapper">
    <div class="login-card">
      <button class="theme-toggle login-theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
      </button>

      <div class="login-brand" aria-hidden="true">
        <span class="brand-mark">N</span>
      </div>

      <p class="eyebrow">Company HQ</p>
      <h1>Sign in to <span id="login-company">UniCRM</span></h1>
      <p class="login-copy">Access the shared operating dashboard and team tools.</p>

      <form id="login-form" novalidate>
        <label>Who are you?
          <select id="username" required>
            <option value="" disabled selected>Select your name…</option>
          </select>
        </label>

        <label>Dashboard password
          <input type="password" id="password" autocomplete="current-password" required placeholder="Enter the shared workspace password">
        </label>

        <p class="login-error" id="login-error" role="alert" hidden></p>

        <button class="button button-primary login-submit" type="submit" id="login-button">
          Sign in
        </button>
      </form>

      <p class="login-foot">Shared workspace access &mdash; ask an admin for the password.</p>
    </div>
  </main>

  <script>
    (function () {
      "use strict";
      var config = window.DASHBOARD_CONFIG || {};
      var worker = (config.worker || {});
      var workerUrl = worker.url || "";
      var loginPage = worker.loginPage || "login.html";

      // Populate the username dropdown from the team config
      var select = document.getElementById("username");
      var team = config.team || [];
      team.forEach(function (member) {
        var option = document.createElement("option");
        option.value = member.name;
        option.textContent = member.name + " — " + member.role;
        select.appendChild(option);
      });

      // Set company name
      var nameEl = document.getElementById("login-company");
      if (nameEl && config.companyName) nameEl.textContent = config.companyName;
      if (config.companyName) document.title = "Sign in — " + config.companyName;

      // Theme toggle (same logic as app.js setupTheme)
      var root = document.documentElement;
      var toggle = document.getElementById("theme-toggle");
      var media = window.matchMedia("(prefers-color-scheme: dark)");
      function storedTheme() { try { return localStorage.getItem("theme"); } catch (e) { return null; } }
      function apply(theme) {
        root.dataset.theme = theme;
        toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
      }
      apply(root.dataset.theme === "dark" ? "dark" : "light");
      toggle.addEventListener("click", function () {
        var next = root.dataset.theme === "dark" ? "light" : "dark";
        apply(next);
        try { localStorage.setItem("theme", next); } catch (e) { /* storage blocked */ }
      });
      media.addEventListener("change", function (e) { if (!storedTheme()) apply(e.matches ? "dark" : "light"); });

      // Form submission
      var form = document.getElementById("login-form");
      var errorEl = document.getElementById("login-error");
      var button = document.getElementById("login-button");

      if (!workerUrl) {
        errorEl.textContent = "Authentication is not configured. Set worker.url in config.js to enable login.";
        errorEl.hidden = false;
        form.querySelectorAll("input, select, button").forEach(function (el) { el.disabled = true; });
        return;
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value;

        if (!username || !password) {
          showError("Please select your name and enter the password.");
          return;
        }

        errorEl.hidden = true;
        button.disabled = true;
        button.textContent = "Signing in…";

        fetch(workerUrl + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password })
        })
        .then(function (response) {
          if (response.ok) return response.json();
          return response.json().then(function (data) {
            throw new Error(data.error || "Invalid credentials");
          });
        })
        .then(function (data) {
          // Store token for authenticated requests, plus the user's name for the greeting
          try { sessionStorage.setItem("dashboard_token", data.token); } catch (e) {}
          try { sessionStorage.setItem("dashboard_user", (data.user && data.user.name) || ""); } catch (e) {}
          // Redirect to the dashboard (respect ?next= if present and safe)
          var params = new URLSearchParams(location.search);
          var next = params.get("next") || "index.html";
          if (/^(?:https?:)?\/\//.test(next) || /^javascript:/i.test(next)) {
            next = "index.html";
          }
          location.replace(next);
        })
        .catch(function (err) {
          if (err.message.includes("Failed to fetch") || err.message.includes("NetworkError")) {
            showError("Can’t reach the sign-in server — check your connection and try again.");
          } else {
            showError(err.message || "Sign in failed. Please try again.");
          }
          button.disabled = false;
          button.textContent = "Sign in";
        });
      });

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.hidden = false;
      }
    })();
  </script>
</body>
</html>
